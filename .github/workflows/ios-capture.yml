# Builds the R2S Capture iPhone app on a GitHub macOS runner (no Mac needed).
# Repo root = the capture/ folder.
#  * build-unsigned: always. Produces R2SCapture-unsigned.ipa (Actions artifact) for sideloading with
#    AltStore / Sideloadly, which re-sign it with your own Apple ID (see ios/SIDELOAD.md).
#  * testflight: only when the App Store Connect secrets exist (paid Apple Developer Program).
#    Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, APPLE_TEAM_ID; optional variable APP_BUNDLE_ID.
name: ios-capture

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-capture.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-capture.yml"
  workflow_dispatch:

concurrency:
  group: ios-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.yahoo4.r2scapture' }}

jobs:
  build-unsigned:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned, generic iOS device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project R2SCapture.xcodeproj -scheme R2SCapture -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/R2SCapture.app
      - name: Package .ipa
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/R2SCapture.app Payload/
          zip -qry R2SCapture-unsigned.ipa Payload
          ls -la R2SCapture-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: R2SCapture-unsigned-ipa-${{ github.run_number }}
          path: ios/R2SCapture-unsigned.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ios/xcodebuild.log
          if-no-files-found: ignore

  testflight:
    needs: build-unsigned
    runs-on: macos-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request'
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check signing secrets
        id: check
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight upload skipped: ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 / APPLE_TEAM_ID not set."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: Install XcodeGen and generate
        if: steps.check.outputs.ok == 'true'
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Archive (automatic signing via App Store Connect API key)
        if: steps.check.outputs.ok == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          xcodebuild -project R2SCapture.xcodeproj -scheme R2SCapture -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/R2SCapture.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 50
      - name: Export and upload to TestFlight
        if: steps.check.outputs.ok == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          plutil -replace teamID -string "$APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/R2SCapture.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 50
          rm -f "$KEY"
