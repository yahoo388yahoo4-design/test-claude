name: R2SCapture
options:
  bundleIdPrefix: com.yahoo4
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  R2SCapture:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: R2SCapture
    info:
      path: R2SCapture/Info.plist
      properties:
        CFBundleDisplayName: R2S Capture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Records RGB video, LiDAR depth and camera poses for 3D datasets."
        NSMicrophoneUsageDescription: "Optionally records an audio track with the capture video."
        NSMotionUsageDescription: "Records accelerometer, gyroscope, magnetometer and barometer data with each capture."
        NSLocationWhenInUseUsageDescription: "Optionally records GPS position and heading with each capture."
        NSLocalNetworkUsageDescription: "Uploads finished captures to your computer over Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yahoo4.r2scapture
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
